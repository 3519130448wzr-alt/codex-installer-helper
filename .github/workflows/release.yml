name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sign-notarize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_TAG="$GITHUB_REF_NAME"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Test and security check
        run: |
          make test
          make security-check

      - name: Import Developer ID certificate
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/codex-installer-signing.keychain-db
          P12_PATH: ${{ runner.temp }}/developer-id.p12
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build signed universal DMG
        env:
          SIGNING_IDENTITY: "Developer ID Application: ${{ secrets.APPLE_DEVELOPER_ID_NAME }} (${{ secrets.APPLE_TEAM_ID }})"
          BUILD_NUMBER: ${{ github.run_number }}
        run: make dmg

      - name: Notarize and staple
        shell: bash
        env:
          API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          printf '%s' "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          APPLE_API_PRIVATE_KEY_PATH="$API_KEY_PATH" bash scripts/notarize.sh

      - name: Verify final artifact
        shell: bash
        run: |
          DMG="build/Codex-Installer-Helper-$VERSION-macOS.dmg"
          hdiutil verify "$DMG"
          shasum -a 256 -c "$DMG.sha256"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=()
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE+=(--prerelease); fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${PRERELEASE[@]}" || \
            gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "build/Codex-Installer-Helper-$VERSION-macOS.dmg" \
            "build/Codex-Installer-Helper-$VERSION-macOS.dmg.sha256" \
            --clobber

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/codex-installer-signing.keychain-db
          P12_PATH: ${{ runner.temp }}/developer-id.p12
          API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$P12_PATH" "$API_KEY_PATH"
